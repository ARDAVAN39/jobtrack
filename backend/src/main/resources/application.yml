spring:
  application:
    name: jobtrack-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobtrack}
    username: ${DB_USER:jobtrack}
    password: ${DB_PASSWORD:jobtrack}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jobtrack:
  jwt:
    # At least 32 bytes. The default is for local development only; set JWT_SECRET everywhere else.
    secret: ${JWT_SECRET:local-development-secret-change-me-0123456789}
    issuer: jobtrack
    ttl: 8h

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
