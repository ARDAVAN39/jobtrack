# The whole app: MySQL, the Spring Boot API and nginx serving the React build.
#   docker compose up --build
# then open http://localhost:8080
services:
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/jobtrack
      DB_USER: jobtrack
      DB_PASSWORD: jobtrack
      # Change this for anything but a local demo: anyone who knows it can sign tokens.
      JWT_SECRET: ${JWT_SECRET:-compose-demo-secret-change-me-0123456789}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobtrack
      MYSQL_USER: jobtrack
      MYSQL_PASSWORD: jobtrack
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujobtrack", "-pjobtrack"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysqldata:
